<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Hi, I'm Rishiraj — Computer Engineering at Iowa State">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="chipGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="c1"><rect x="90" y="140" height="36" width="0">
      <animate attributeName="width" dur="9s" begin="0s" repeatCount="indefinite"
        keyTimes="0;0.111;0.267;0.311;1" values="0;500;500;0;0"/></rect></clipPath>
    <clipPath id="c2"><rect x="90" y="140" height="36" width="0">
      <animate attributeName="width" dur="9s" begin="0s" repeatCount="indefinite"
        keyTimes="0;0.333;0.444;0.6;0.644;1" values="0;0;410;410;0;0"/></rect></clipPath>
    <clipPath id="c3"><rect x="90" y="140" height="36" width="0">
      <animate attributeName="width" dur="9s" begin="0s" repeatCount="indefinite"
        keyTimes="0;0.667;0.778;0.933;0.977;1" values="0;0;350;350;0;0"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .fadeUp { opacity: 0; animation: fadeUp 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.7s; } .d3 { animation-delay: 1.2s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .trace { fill: none; stroke: #30363d; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .node { fill: #0d1117; stroke: #484f58; stroke-width: 2; }
    .halo { animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 0.25; } 50% { opacity: 0.6; } }
  </style>

  <!-- background -->
  <rect width="1000" height="260" rx="16" fill="#0d1117"/>
  <rect width="1000" height="260" rx="16" fill="url(#grid)" opacity="0.6"/>

  <!-- left: text -->
  <g class="fadeUp d1">
    <text x="60" y="105" class="sans" font-size="52" font-weight="700" fill="url(#nameGrad)">Hi, I'm Rishiraj</text>
  </g>

  <g class="fadeUp d2">
    <text x="60" y="166" class="mono" font-size="26" fill="#3fb950">&gt;</text>
    <g clip-path="url(#c1)"><text x="90" y="166" class="mono" font-size="26" fill="#e6edf3" textLength="495" lengthAdjust="spacingAndGlyphs">Computer Engineering @ Iowa State</text></g>
    <g clip-path="url(#c2)"><text x="90" y="166" class="mono" font-size="26" fill="#e6edf3" textLength="405" lengthAdjust="spacingAndGlyphs">Embedded Systems · C · VHDL</text></g>
    <g clip-path="url(#c3)"><text x="90" y="166" class="mono" font-size="26" fill="#e6edf3" textLength="345" lengthAdjust="spacingAndGlyphs">From registers to React</text></g>
    <rect class="cursor" x="92" y="145" width="3" height="27" fill="#58a6ff">
      <animate attributeName="x" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.111;0.267;0.311;0.333;0.444;0.6;0.644;0.667;0.778;0.933;0.977;1"
        values="92;590;590;92;92;500;500;92;92;440;440;92;92"/>
    </rect>
  </g>

  <g class="fadeUp d3">
    <text x="60" y="215" class="sans" font-size="17" fill="#8b949e">Ames, IA  ·  Embedded · Web · AI  ·  Open to internships</text>
  </g>

  <!-- right: circuit -->
  <g>
    <path class="trace" d="M755,105 H700 V60 H610"/>
    <path class="trace" d="M755,130 H640"/>
    <path class="trace" d="M755,155 H710 V205 H620"/>
    <path class="trace" d="M845,105 H900 V55 H955"/>
    <path class="trace" d="M845,130 H965"/>
    <path class="trace" d="M845,155 H890 V210 H955"/>
    <path class="trace" d="M785,85 V35"/>
    <path class="trace" d="M815,85 V60 H860 V30"/>
    <path class="trace" d="M800,175 V235"/>

    <circle class="node" cx="610" cy="60" r="5"/>
    <circle class="node" cx="640" cy="130" r="5"/>
    <circle class="node" cx="620" cy="205" r="5"/>
    <circle class="node" cx="955" cy="55" r="5"/>
    <circle class="node" cx="965" cy="130" r="5"/>
    <circle class="node" cx="955" cy="210" r="5"/>
    <circle class="node" cx="785" cy="35" r="5"/>
    <circle class="node" cx="860" cy="30" r="5"/>
    <circle class="node" cx="800" cy="235" r="5"/>

    <!-- data pulses -->
    <g filter="url(#glow)">
      <circle r="4" fill="#58a6ff"><animateMotion dur="2.4s" repeatCount="indefinite" path="M755,105 H700 V60 H610"/></circle>
      <circle r="4" fill="#a371f7"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite" path="M755,130 H640"/></circle>
      <circle r="4" fill="#3fb950"><animateMotion dur="2.6s" begin="1.1s" repeatCount="indefinite" path="M755,155 H710 V205 H620"/></circle>
      <circle r="4" fill="#a371f7"><animateMotion dur="2.2s" begin="0.3s" repeatCount="indefinite" path="M845,105 H900 V55 H955"/></circle>
      <circle r="4" fill="#58a6ff"><animateMotion dur="1.6s" begin="1.4s" repeatCount="indefinite" path="M845,130 H965"/></circle>
      <circle r="4" fill="#3fb950"><animateMotion dur="2.5s" begin="0.9s" repeatCount="indefinite" path="M845,155 H890 V210 H955"/></circle>
      <circle r="4" fill="#58a6ff"><animateMotion dur="1.4s" begin="0.2s" repeatCount="indefinite" path="M785,85 V35"/></circle>
      <circle r="4" fill="#a371f7"><animateMotion dur="2s" begin="1.6s" repeatCount="indefinite" path="M815,85 V60 H860 V30"/></circle>
      <circle r="4" fill="#3fb950"><animateMotion dur="1.5s" begin="0.7s" repeatCount="indefinite" path="M800,175 V235"/></circle>
    </g>

    <!-- chip -->
    <rect class="halo" x="745" y="75" width="110" height="110" rx="14" fill="#58a6ff" filter="url(#chipGlow)"/>
    <g fill="#484f58">
      <rect x="748" y="100" width="7" height="10" rx="1"/><rect x="748" y="125" width="7" height="10" rx="1"/><rect x="748" y="150" width="7" height="10" rx="1"/>
      <rect x="845" y="100" width="7" height="10" rx="1"/><rect x="845" y="125" width="7" height="10" rx="1"/><rect x="845" y="150" width="7" height="10" rx="1"/>
      <rect x="780" y="78" width="10" height="7" rx="1"/><rect x="810" y="78" width="10" height="7" rx="1"/>
      <rect x="795" y="175" width="10" height="7" rx="1"/>
    </g>
    <rect x="755" y="85" width="90" height="90" rx="10" fill="url(#chipGrad)" stroke="#58a6ff" stroke-width="2"/>
    <rect x="767" y="97" width="66" height="66" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <text x="800" y="140" text-anchor="middle" class="mono" font-size="28" font-weight="700" fill="url(#nameGrad)">RP</text>
  </g>
</svg>
